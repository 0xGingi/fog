[package]
name = "fog-desktop"
version = "0.1.0"
description = "Fog desktop app"
license = "AGPL-3.0-only"
edition = "2024"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde_json = "1.0.154"
tauri = { version = "2.12.7", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-notification = "2.8.1"
tauri-plugin-updater = "2.14.1"
tokio = { version = "1.54.1", features = ["time"] }

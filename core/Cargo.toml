[package]
name = "fog-core"
version = "0.5.2"
edition = "2024"
license = "AGPL-3.0-only"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
argon2 = { version = "0.6.0", default-features = false, features = ["alloc"] }
async-trait = "0.1.92"
base64 = "0.23.1"
bip39 = "3.0.0"
futures-util = "0.3.34"
hkdf = "0.13.0"
libsignal-protocol = { git = "https://github.com/signalapp/libsignal", tag = "v0.108.7", version = "0.1.0" }
postcard = { version = "1.2.0", default-features = false, features = ["alloc"] }
rand = "0.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
wasm-bindgen = "=0.2.130"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom02 = { version = "0.2", package = "getrandom", features = ["js"] }
getrandom03 = { version = "0.3", package = "getrandom", features = ["wasm_js"] }
getrandom04 = { version = "0.4", package = "getrandom", features = ["wasm_js"] }

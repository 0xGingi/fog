# Desktop releases. Push a tag like v0.2.0 and this builds Fog for every platform and publishes a
# GitHub release with the installers. Running it by hand from the Actions tab builds everything as
# downloadable workflow artifacts without making a release.
name: Release desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The crypto core is compiled to WebAssembly once and shared, so every platform ships the same bytes.
  core:
    name: Crypto core (wasm)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0 # same as the Dockerfile
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: wasm-bindgen@0.2.130 # must match the wasm-bindgen crate version in core/Cargo.toml
      - run: cargo build --release -p fog-core --target wasm32-unknown-unknown
      - run: wasm-bindgen --target web --out-dir web/src/core target/wasm32-unknown-unknown/release/fog_core.wasm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fog-core
          path: web/src/core
          if-no-files-found: error

  desktop:
    name: ${{ matrix.name }}
    needs: core
    permissions:
      contents: write # create the draft release and upload installers
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS (Apple silicon), os: macos-15, target: aarch64-apple-darwin, asset: Fog-macOS-arm64 }
          - { name: Linux x64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, asset: Fog-Linux-x64 }
          - { name: Linux arm64, os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, asset: Fog-Linux-arm64 }
          - { name: Windows x64, os: windows-2025, target: x86_64-pc-windows-msvc, asset: Fog-Windows-x64 }
    runs-on: ${{ matrix.os }}
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fog-core
          path: web/src/core

      # Ubuntu 22.04 keeps the Linux builds compatible with older glibc versions.
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential file libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: web/src-tauri -> target
          key: ${{ matrix.target }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
        working-directory: web

      # The tag is the version: v0.2.0 builds Fog 0.2.0.
      - name: Version from tag
        if: github.ref_type == 'tag'
        working-directory: web
        run: V="${GITHUB_REF_NAME#v}" bun -e 'const f = "src-tauri/tauri.conf.json"; const c = await Bun.file(f).json(); c.version = process.env.V; await Bun.write(f, JSON.stringify(c, null, 2) + "\n")'

      # Signing and notarization switch on when the Apple secrets exist (see README). Without them
      # the app is ad-hoc signed, which runs but makes Gatekeeper warn on first open.
      - name: Apple signing
        if: runner.os == 'macOS' && env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for k in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!k}" ] && echo "$k=${!k}" >> "$GITHUB_ENV"
          done

      # GitHub's macOS runners sometimes fail making the .dmg ("hdiutil: create failed - Resource busy")
      # because Spotlight or XProtect is scanning the new disk image. Keep them out of the way.
      - name: Quiet Spotlight and XProtect (macOS)
        if: runner.os == 'macOS'
        run: |
          sudo mdutil -a -i off || true
          sudo pkill -9 XProtect || true

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the auto-update files; installed apps only accept updates signed with this key.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: web
          tauriScript: bunx tauri
          # Update bundles (.app.tar.gz, signed installers) are built in CI only, where the key is.
          args: --target ${{ matrix.target }} --config '{"bundle":{"createUpdaterArtifacts":true}}'
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Fog ${{ github.ref_name }}
          releaseBody: |
            Desktop apps for Fog. Pick the file for your system:

            - **macOS (Apple silicon):** `Fog-macOS-arm64.dmg`
            - **Windows (x64):** `Fog-Windows-x64-setup.exe` (or `.msi`)
            - **Linux:** `.AppImage`, `.deb` or `.rpm`, for x64 (amd64/x86_64) or arm64 (aarch64)
          # Published straight away and not a pre-release, so getfog.org's /releases/latest link finds it.
          releaseDraft: false
          # Version-free names (Fog-macOS-arm64.dmg, Fog-Windows-x64-setup.exe, ...) so getfog.org can link
          # to releases/latest/download/<file> and always serve the newest build.
          releaseAssetNamePattern: ${{ matrix.asset }}[setup][ext]
          uploadWorkflowArtifacts: true
          # One more try if a build or upload hits a transient runner error.
          retryAttempts: 1
          # latest.json: what installed apps check for updates (macOS .app.tar.gz, Windows setup.exe, Linux AppImage).
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true

  # Android: one signed APK (arm64, 32-bit ARM, x86_64) attached to the release as Fog-Android.apk.
  # GitHub's Ubuntu image already has the Android SDK, NDK and Java 17.
  android:
    name: Android
    needs: core
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      HAS_KEYSTORE: ${{ secrets.FOG_ANDROID_KEYSTORE_B64 != '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fog-core
          path: web/src/core
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: web/src-tauri -> target
          key: android
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
        working-directory: web
      - name: Android SDK pieces
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          # `yes` gets a broken pipe once sdkmanager is done; that's not a failure (sdkmanager's own exit status still counts).
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;37.0.0" > /dev/null
      - name: Version from tag
        if: github.ref_type == 'tag'
        working-directory: web
        run: V="${GITHUB_REF_NAME#v}" bun -e 'const f = "src-tauri/tauri.conf.json"; const c = await Bun.file(f).json(); c.version = process.env.V; await Bun.write(f, JSON.stringify(c, null, 2) + "\n")'
      # Every update must be signed with the same key, or Android refuses to install it over the old app.
      - name: Signing key
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.FOG_ANDROID_KEYSTORE_B64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/fog-release.jks"
          echo "FOG_ANDROID_KEYSTORE=$RUNNER_TEMP/fog-release.jks" >> "$GITHUB_ENV"
      # Push notifications (Firebase). Without this secret the APK still builds; it just can't get pushes.
      - name: Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        if: env.GOOGLE_SERVICES_JSON != ''
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > web/src-tauri/gen/android/app/google-services.json
      # The APK goes on the GitHub release and updates itself from there. The .aab is what Google Play
      # takes (uploaded by hand): built with FOG_PLAY=1, which drops the self-updater (Play forbids it).
      - name: Build APK and App Bundle
        working-directory: web
        env:
          FOG_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.FOG_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          bunx tauri android build --apk --target aarch64 --target armv7 --target x86_64
          apk=$(find src-tauri/gen/android/app/build/outputs/apk/universal/release -name '*.apk' | head -1)
          cp "$apk" "$GITHUB_WORKSPACE/Fog-Android.apk"
          FOG_PLAY=1 bunx tauri android build --aab --target aarch64 --target armv7 --target x86_64
          aab=$(find src-tauri/gen/android/app/build/outputs/bundle -name '*.aab' | head -1)
          cp "$aab" "$GITHUB_WORKSPACE/Fog-Android.aab"
          # Guard: the Play bundle must not be able to install packages (Play rejects self-updaters).
          if unzip -p "$GITHUB_WORKSPACE/Fog-Android.aab" base/manifest/AndroidManifest.xml | grep -q REQUEST_INSTALL_PACKAGES; then
            echo "::error::Fog-Android.aab still has REQUEST_INSTALL_PACKAGES"; exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fog-android
          path: |
            Fog-Android.apk
            Fog-Android.aab
      - name: Attach to the release
        if: github.ref_type == 'tag' && env.HAS_KEYSTORE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The desktop jobs usually create the release; wait for it, or create it if they haven't.
          for _ in $(seq 1 15); do gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 && break; sleep 60; done
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Fog $GITHUB_REF_NAME" --notes "Fog $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" Fog-Android.apk --clobber

  # fog-bot: run a Fog account as a bot (see bot/README.md). One self-contained binary per platform,
  # cross-compiled by bun from one runner, attached to the release.
  bot:
    name: fog-bot
    needs: core
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fog-core
          path: web/src/core
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
        working-directory: web
      # fog-telegram (telegram/README.md) has its own dependencies.
      - run: bun install --frozen-lockfile
        working-directory: telegram
      - name: Build
        run: |
          for t in linux-x64 linux-arm64 darwin-arm64 darwin-x64 windows-x64; do
            ext=""; [ "$t" = windows-x64 ] && ext=".exe"
            bun build --compile --minify --target="bun-$t" bot/main.ts --outfile "dist/fog-bot-$t$ext"
            bun build --compile --minify --target="bun-$t" telegram/main.ts --outfile "dist/fog-telegram-$t$ext"
          done
          ls -la dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fog-bot
          path: dist/
      - name: Attach to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          for _ in $(seq 1 15); do gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 && break; sleep 60; done
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Fog $GITHUB_REF_NAME" --notes "Fog $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  # iOS: signed for the App Store and uploaded to TestFlight. Switches on once the Apple secrets
  # exist (see README); until then it only says it's skipping.
  ios:
    name: iOS (TestFlight)
    needs: core
    runs-on: xcode-27 # the only image with Xcode 27 (iOS 27 SDK) so far
    env:
      HAS_IOS: ${{ secrets.IOS_CERTIFICATE != '' && secrets.IOS_MOBILE_PROVISION != '' && secrets.APPSTORE_API_KEY != '' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Signing secrets
        if: env.HAS_IOS != 'true'
        run: echo "::notice::iOS signing secrets aren't set yet, so there's no TestFlight build this time."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_IOS == 'true'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.HAS_IOS == 'true'
        with:
          name: fog-core
          path: web/src/core
      # Newest Xcode on the runner, so builds use the newest iOS SDK (the App Store sets a minimum).
      - name: Xcode
        if: env.HAS_IOS == 'true'
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|rc' | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        if: env.HAS_IOS == 'true'
        with:
          toolchain: stable
          targets: aarch64-apple-ios
          # swift-rs needs llvm-objcopy with Xcode 27, or the Swift plugins' entry points (@_cdecl)
          # stay internal and the link fails with "Undefined symbols: _init_plugin_fog".
          components: llvm-tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: env.HAS_IOS == 'true'
        with:
          workspaces: web/src-tauri -> target
          key: ios
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: env.HAS_IOS == 'true'
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
        if: env.HAS_IOS == 'true'
        working-directory: web
      - name: Version from tag
        if: env.HAS_IOS == 'true' && github.ref_type == 'tag'
        working-directory: web
        run: V="${GITHUB_REF_NAME#v}" bun -e 'const f = "src-tauri/tauri.conf.json"; const c = await Bun.file(f).json(); c.version = process.env.V; await Bun.write(f, JSON.stringify(c, null, 2) + "\n")'
      - name: Build for the App Store
        if: env.HAS_IOS == 'true'
        working-directory: web
        env:
          # Apple Distribution certificate (.p12, base64) and App Store provisioning profile (base64).
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
        run: bunx tauri ios build --export-method app-store-connect
      - name: Upload to TestFlight
        if: env.HAS_IOS == 'true' && github.ref_type == 'tag'
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          API_KEY: ${{ secrets.APPSTORE_API_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$API_KEY" > ~/.appstoreconnect/private_keys/AuthKey_"$API_KEY_ID".p8
          ipa=$(find web/src-tauri/gen/apple/build -name '*.ipa' | head -1)
          xcrun altool --upload-app --type ios --file "$ipa" --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER"

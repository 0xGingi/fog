# coturn for Fog. Credentials are short-lived HMACs minted by fog-server (TURN REST API).
listening-port=3478
# Behind 1:1 NAT (AWS, GCP, many VPS hosts)? Uncomment with your public and private IPs:
# external-ip=203.0.113.10/10.0.0.5
use-auth-secret
fingerprint
min-port=49160
max-port=49260
no-cli
no-tlsv1
no-tlsv1_1
no-multicast-peers
no-loopback-peers
stale-nonce=600
total-quota=200
# Concurrent allocations per Fog account (coturn counts all of an account's time-stamped usernames
# together). A group call is a mesh: up to 7 peer connections, each allocating over UDP and TCP.
user-quota=16
# No logs: they'd hold callers' IP addresses and account IDs (see getfog.org/privacy). simple-log
# keeps coturn from adding a date to the file name, so /dev/null stays /dev/null.
simple-log
log-file=/dev/null
no-stdout-log
# Never relay into private networks (stops TURN being used to reach this host's internals).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
# Special-purpose IPv4: protocol assignments, documentation, benchmarking, reserved and broadcast.
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255
denied-peer-ip=::
denied-peer-ip=::1
# IPv4-mapped, NAT64 and 6to4 addresses carry an IPv4 address (which could be a private one).
denied-peer-ip=::ffff:0:0-::ffff:ffff:ffff
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=64:ff9b:1::-64:ff9b:1:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=2002::-2002:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# Discard, Teredo and documentation.
denied-peer-ip=100::-100::ffff:ffff:ffff:ffff
denied-peer-ip=2001::-2001:0:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=2001:db8::-2001:db8:ffff:ffff:ffff:ffff:ffff:ffff
# Unique local, link local and the old site-local range.
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fec0::-feff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

[package]
name = "fog-server"
version = "0.3.2"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
fog-core = { path = "../core" }
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
curve25519-dalek = "5.0.0"
ed25519-dalek = "3.0.0"
futures-util = "0.3.34"
hmac = "0.13.0"
rand = "0.10"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "charset"] }
ring = "0.17.14"
rusqlite = { version = "0.43.0", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tower-http = { version = "0.7.1", features = ["fs", "set-header", "cors"] }

